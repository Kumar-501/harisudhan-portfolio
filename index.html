    <!-- Apply the saved theme before paint to avoid a flash of the wrong theme -->
    <script>
      (function () {
        var DARK = {
          emerald: 1, amber: 1, cyan: 1, violet: 1, rose: 1, blue: 1
        };
        var id = "emerald";
        try {
          var stored = localStorage.getItem("harisudhan-theme");
          if (stored && (DARK[stored] || stored.indexOf("light-") === 0)) {
            id = stored;
          }
        } catch (e) {}
        var root = document.documentElement;
        root.setAttribute("data-theme", id);
        var isDark = !!DARK[id];
        if (isDark) root.classList.add("dark");
        root.style.colorScheme = isDark ? "dark" : "light";
      })();
    </script>
